name: SOKUGAN daily content
# 翌日分の教材を生成・QA・公開する。実行主体は Claude Code
# （anthropics/claude-code-action）。
#
# cron は停止中（2026-08-31）。理由:
#   1. このリポジトリ（origin = sokugan-workspace / PRIVATE）は作業リポジトリで、
#      公開先は production = sokugan / PUBLIC の GitHub Pages。GITHUB_TOKEN は
#      リポジトリを跨げないため、このワークフローだけでは公開まで到達できない。
#   2. 現在の日次公開はローカルの launchd ジョブ
#      （local.wota.codex-sokugan-daily-refresh / 18:00 JST）が担っている。
#      そちらは origin と production の両方へ push できる。
#   3. cron を残すと、Secret 未設定の Preflight 失敗が毎日出続ける。
# 復活の条件: production への push 権限を持つ PAT を Secret に登録し、
# 公開ステップを追加してから schedule を戻す。
on:
  # schedule:
  #   - cron: "0 9 * * *"      # 09:00 UTC = 18:00 JST
  workflow_dispatch:

concurrency:
  group: sokugan-content
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # 認証未設定のまま走ると原因の分かりにくいFAILが毎日出る。先に明示的に落とす。
      - name: Preflight - 認証Secretの確認
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 値そのものは絶対に出力しない。長さと空白混入だけを報告する。
          # 「空」と「改行が混入して401」は原因も対処も違うため、ここで切り分ける。
          if [ -z "$TOKEN" ]; then
            echo "::error title=CLAUDE_CODE_OAUTH_TOKEN が空::Secretが未登録か、空の値で保存されています。gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo <owner>/<repo> を実行し、対話プロンプトに貼り付けてください（claude setup-token の出力値）。"
            exit 1
          fi
          LEN=${#TOKEN}
          TRIMMED=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          TLEN=${#TRIMMED}
          echo "OAuth token あり（長さ ${LEN} 文字 / 空白除去後 ${TLEN} 文字）"
          if [ "$LEN" -ne "$TLEN" ]; then
            echo "::error title=トークンに空白・改行が混入::長さ ${LEN} に対し空白除去後は ${TLEN} で、空白か改行が含まれています。これは 401 Invalid bearer token の原因になります。echo でパイプすると末尾に改行が付くため、gh secret set の対話プロンプトに貼り付けてください。"
            exit 1
          fi
          if [ "$LEN" -lt 40 ]; then
            echo "::error title=トークンが短すぎる::長さ ${LEN} 文字はOAuthトークンとして短すぎます。貼り付けが途中で切れていないか確認してください。"
            exit 1
          fi
          echo "形式チェック通過。教材生成へ進みます。"
      - name: Node のバージョンを固定（QAハーネス実行用）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            リポジトリ直下の CLAUDE.md と .claude/commands/daily.md を読み、
            daily.md の手順1〜7を順番どおりに実行せよ。
            QAハーネスが全PASS（終了コード0）になるまで完了してはならない。
            全PASS後に必ず git add -A && git commit && git push origin main まで行うこと。
          # 運用コスト固定: action側に model/effort の入力は無いため、
          # CLIへ直接渡る claude_args で指定する（--effort は low/medium/high/xhigh/max）。
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash"
