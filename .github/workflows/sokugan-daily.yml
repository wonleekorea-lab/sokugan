name: SOKUGAN daily content
# 毎日18:00 JSTに翌日分の教材を生成・QA・公開する。実行主体は Claude Code
# （anthropics/claude-code-action）。ローカルCodex自動化には依存しない。
on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC = 18:00 JST
  workflow_dispatch:

concurrency:
  group: sokugan-content
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      # 認証未設定のまま走ると原因の分かりにくいFAILが毎日出る。先に明示的に落とす。
      - name: Preflight - 認証Secretの確認
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=CLAUDE_CODE_OAUTH_TOKEN が未設定::リポジトリの Settings > Secrets and variables > Actions に CLAUDE_CODE_OAUTH_TOKEN を登録してください（ローカルで claude setup-token を実行して得た値）。"
            exit 1
          fi
          echo "OAuth token あり。教材生成へ進みます。"
      - name: Node のバージョンを固定（QAハーネス実行用）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            リポジトリ直下の CLAUDE.md と .claude/commands/daily.md を読み、
            daily.md の手順1〜7を順番どおりに実行せよ。
            QAハーネスが全PASS（終了コード0）になるまで完了してはならない。
            全PASS後に必ず git add -A && git commit && git push origin main まで行うこと。
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash"
