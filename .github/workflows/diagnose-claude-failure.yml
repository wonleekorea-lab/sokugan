name: SOKUGAN Claude失敗の診断

# daily は Preflight / Node を通過したあと claude-code-action 内で is_error:true になる。
# 実際のエラー文は "full output hidden for security" で隠されるため、原因を切り分ける。
#
# 切り分けの構造:
#   job minimal … 最小構成（Readのみ・1ターン・自明なプロンプト）で認証が生きているかを見る
#   job asdaily … dailyと同一の claude_args（全ツール・60ターン）＋自明なプロンプト
# 両方とも本文を生成しないので、show_full_output を有効にしてもログに教材本文は出ない。
# minimal成功 かつ asdaily失敗 → 設定（.claude/settings.json のhooks等）が原因。
# 両方失敗 → 認証・サブスクリプション側の問題。
on:
  workflow_dispatch:

jobs:
  minimal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write        # これが無いとOIDCトークンを取れずClaudeに到達しない
    steps:
      - uses: actions/checkout@v6
      - name: 最小構成でClaudeを起動
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Reply with exactly: ok
          claude_args: |
            --max-turns 1
            --allowedTools "Read"

  asdaily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: daily と同一の引数でClaudeを起動（プロンプトのみ自明なものに）
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            Reply with exactly: ok
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash"
