name: SOKUGAN QA supervisor
# 毎日19:00 JST、daily生成の1時間後に監督を走らせる。設問を自力で解き、
# 明快さを採点し、必要なら書き直してから公開する。
#
# cron は停止中（2026-08-31）。理由は sokugan-daily.yml のコメントと同じ
# （公開先が別リポジトリで GITHUB_TOKEN が跨げない／Secret 未設定の失敗が毎日出る）。
# 現在は launchd ジョブ側の QA ゲートが同じ検査を担っている。
on:
  # schedule:
  #   - cron: "0 10 * * *"     # 10:00 UTC = 19:00 JST
  workflow_dispatch:

concurrency:
  group: sokugan-content
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Preflight - 認証Secretの確認
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 値そのものは絶対に出力しない。長さと空白混入だけを報告する。
          if [ -z "$TOKEN" ]; then
            echo "::error title=CLAUDE_CODE_OAUTH_TOKEN が空::Secretが未登録か、空の値で保存されています。gh secret set の対話プロンプトに貼り付けてください。"
            exit 1
          fi
          LEN=${#TOKEN}
          TRIMMED=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          TLEN=${#TRIMMED}
          echo "OAuth token あり（長さ ${LEN} 文字 / 空白除去後 ${TLEN} 文字）"
          if [ "$LEN" -ne "$TLEN" ]; then
            echo "::error title=トークンに空白・改行が混入::長さ ${LEN} に対し空白除去後は ${TLEN}。401 Invalid bearer token の原因になります。"
            exit 1
          fi
          if [ "$LEN" -lt 40 ]; then
            echo "::error title=トークンが短すぎる::長さ ${LEN} 文字は短すぎます。貼り付けが途中で切れていないか確認してください。"
            exit 1
          fi
          echo "形式チェック通過。監督へ進みます。"
      - name: Node のバージョンを固定（QAハーネス実行用）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            リポジトリ直下の CLAUDE.md と .claude/commands/qa.md を読み、
            qa.md の手順1〜6を順番どおりに実行せよ。
            機械検査だけで終わらせず、手順3の精読監査（全15問を自力で解く／日本語の明快さ／
            読み応え／keyTerms・takeawayの質）を必ず行い、clarity-audit.json を更新すること。
            修正した場合のみ git push origin main する。QAがFAILのままpushしてはならない。
          # 運用コスト固定: action側に model/effort の入力は無いため、
          # CLIへ直接渡る claude_args で指定する（--effort は low/medium/high/xhigh/max）。
          claude_args: |
            --model claude-sonnet-5
            --effort medium
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash"
