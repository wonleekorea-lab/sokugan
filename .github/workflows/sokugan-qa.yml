name: SOKUGAN QA supervisor
# 毎日19:00 JST、daily生成の1時間後に監督を走らせる。設問を自力で解き、
# 明快さを採点し、必要なら書き直してから公開する。
on:
  schedule:
    - cron: "0 10 * * *"     # 10:00 UTC = 19:00 JST
  workflow_dispatch:

concurrency:
  group: sokugan-content
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Preflight - 認証Secretの確認
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error title=CLAUDE_CODE_OAUTH_TOKEN が未設定::リポジトリの Settings > Secrets and variables > Actions に CLAUDE_CODE_OAUTH_TOKEN を登録してください（ローカルで claude setup-token を実行して得た値）。"
            exit 1
          fi
          echo "OAuth token あり。監督へ進みます。"
      - name: Node のバージョンを固定（QAハーネス実行用）
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            リポジトリ直下の CLAUDE.md と .claude/commands/qa.md を読み、
            qa.md の手順1〜6を順番どおりに実行せよ。
            機械検査だけで終わらせず、手順3の精読監査（全15問を自力で解く／日本語の明快さ／
            読み応え／keyTerms・takeawayの質）を必ず行い、clarity-audit.json を更新すること。
            修正した場合のみ git push origin main する。QAがFAILのままpushしてはならない。
          claude_args: |
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash"
