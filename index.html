<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokugan 3.2 — Reading Fluency Lab</title>
<meta name="theme-color" content="#f6f7f9">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="速眼">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<!-- 外部サービス設定（公開して安全な anon key のみ）。未設定でもアプリは動く。 -->
<script src="./sokugan-config.js"></script>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --card2:#f0f2f5; --border:#e5e8ec; --border2:#d3d8df;
  --ink:#1b2430; --ink2:#57636f; --ink3:#8b95a1;
  --coral:#e0492f; --coral-dim:rgba(224,73,47,.10);
  --green:#1a7f37; --green-dim:rgba(26,127,55,.10);
  --gold:#9a6700; --gold-dim:rgba(154,103,0,.10);
  --blue:#0969da; --blue-dim:rgba(9,105,218,.08);
  --purple:#8250df;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
#app{max-width:760px;margin:0 auto;padding:18px 16px 80px}
a{color:var(--blue)}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-size:19px;font-weight:800;letter-spacing:.02em}
.logo small{font-size:11px;color:var(--coral);font-weight:700;margin-left:6px;vertical-align:2px}
.header-stats{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.header-stats b{color:var(--ink);font-size:14px}
.nav{display:flex;gap:6px;margin-bottom:16px}
.nav button{flex:1;background:var(--card);border:1px solid var(--border);color:var(--ink2);padding:8px 0;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.nav button.active{background:var(--card2);color:var(--ink);border-color:var(--border2);font-weight:700}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(27,36,48,.05)}
.card-title{font-size:15px;font-weight:800;margin-bottom:2px}
.card-subtitle{font-size:11px;color:var(--ink3);letter-spacing:.08em;margin-bottom:12px}
.banner{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;border:1px solid var(--border2)}
.banner.info{background:var(--blue-dim);border-color:rgba(88,166,255,.3)}
.banner.warn{background:var(--gold-dim);border-color:rgba(210,153,34,.35)}
.banner.ok{background:var(--green-dim);border-color:rgba(63,185,80,.3)}
.btn{display:inline-block;background:var(--coral);color:#fff;border:none;border-radius:10px;padding:13px 22px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;width:100%;text-align:center}
.btn:active{transform:scale(.985)}
.btn.secondary{background:var(--card2);color:var(--ink);border:1px solid var(--border2)}
.btn.small{width:auto;padding:8px 16px;font-size:13px;font-weight:700}
.btn.ghost{background:none;border:1px dashed var(--border2);color:var(--ink2)}
.target-hero{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
.target-hero .num{font-size:44px;font-weight:900;letter-spacing:-.02em;color:var(--coral)}
.target-hero .unit{font-size:14px;color:var(--ink2)}
.delta-chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.delta-chip.up{background:var(--green-dim);color:var(--green)}
.delta-chip.down{background:var(--coral-dim);color:var(--coral)}
.delta-chip.flat{background:var(--card2);color:var(--ink2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat-box{background:var(--card2);border-radius:10px;padding:12px;text-align:center}
.stat-box .v{font-size:22px;font-weight:900}
.stat-box .l{font-size:11px;color:var(--ink2);margin-top:2px}
.win-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.win-item:last-child{border-bottom:none}
.win-item .ico{font-size:16px;line-height:1.4}
.win-item .d{color:var(--ink3);font-size:11px}
.reading-text{font-size:19px;line-height:2.15;letter-spacing:.01em;padding:6px 2px;text-align:justify}
.reading-text.hidden-text{filter:blur(7px);user-select:none}
.chunk{border-radius:4px;padding:1px 1px;transition:background .12s}
.chunk.lit{background:var(--coral-dim);box-shadow:inset 0 -2px 0 var(--coral)}
.chunk.past{color:var(--ink3)}
.timerbar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:10px 0}
.timerbar .fill{height:100%;background:var(--green);border-radius:99px;transition:width .25s linear}
.timerbar .fill.warning{background:var(--gold)}
.timerbar .fill.over{background:var(--coral);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.bigtime{font-variant-numeric:tabular-nums;font-size:30px;font-weight:900;text-align:center;margin:4px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--border2);color:var(--ink);border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.6;cursor:pointer;margin-bottom:8px;font-family:inherit;appearance:none}
.opt:hover{border-color:var(--ink3)}
.opt:focus{outline:none}
.opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-color:var(--blue)}
.opt.correct{border-color:var(--green);background:var(--green-dim)}
.opt.wrong{border-color:var(--coral);background:var(--coral-dim)}
.opt:disabled{cursor:default;opacity:.85}
.rationale{background:var(--blue-dim);border:1px solid rgba(88,166,255,.3);border-radius:10px;padding:10px 13px;font-size:13px;margin:6px 0 12px}
.phase-dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.phase-dots span{width:26px;height:5px;border-radius:99px;background:var(--card2)}
.phase-dots span.done{background:var(--green)}
.phase-dots span.cur{background:var(--coral)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 9px;border-radius:99px;background:var(--card2);color:var(--ink2);margin-right:6px}
.tag.sci{background:var(--blue-dim);color:var(--blue)}
.result-verdict{text-align:center;padding:8px 0 4px}
.result-verdict .big{font-size:52px;font-weight:900;letter-spacing:-.02em}
.result-verdict .sub{font-size:13px;color:var(--ink2)}
.compare-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.compare-row:last-child{border-bottom:none}
.compare-row .lab{color:var(--ink2)}
table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th{text-align:left;color:var(--ink3);font-weight:600;font-size:11px;padding:6px 4px;border-bottom:1px solid var(--border2)}
table.hist td{padding:7px 4px;border-bottom:1px solid var(--border)}
.muted{color:var(--ink2);font-size:13px}
.small{font-size:12px;color:var(--ink3)}
.celebrate{position:fixed;inset:0;background:rgba(246,247,249,.95);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.celebrate .inner{text-align:center;padding:30px}
.celebrate .emoji{font-size:60px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.celebrate h2{font-size:24px;margin:10px 0 6px}
.bench-wrap{margin-top:8px}
.bench-bar{position:relative;height:14px;background:var(--card2);border-radius:99px;overflow:visible}
.bench-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--coral),var(--gold))}
.bench-mark{position:absolute;top:-4px;width:2px;height:22px;background:var(--ink2)}
.bench-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-top:6px}
.genre-bar{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:12px}
.genre-bar .gname{width:62px;color:var(--ink2)}
.genre-bar .gtrack{flex:1;height:9px;background:var(--card2);border-radius:99px;overflow:hidden}
.genre-bar .gfill{height:100%;border-radius:99px}
.genre-bar .gval{width:74px;text-align:right;font-variant-numeric:tabular-nums}
svg text{font-family:inherit}
.footer-note{text-align:center;font-size:11px;color:var(--ink3);margin-top:24px}
button{touch-action:manipulation}
@media (max-width:480px){
  #app{padding:12px 10px 60px}
  .reading-text{font-size:17px;line-height:2.0}
  .header-stats{gap:8px;font-size:11px}
  .stat-box .v{font-size:18px}
  .target-hero .num{font-size:36px}
  .opt{padding:13px 12px}
}
.fresh{border-radius:12px;padding:14px 16px;margin-bottom:14px;border:1px solid var(--border2)}
.fresh.ok{background:var(--green-dim);border-color:rgba(26,127,55,.35)}
.fresh.stale{background:var(--gold-dim);border-color:rgba(154,103,0,.4)}
.fresh.err{background:var(--coral-dim);border-color:rgba(224,73,47,.4)}
.fresh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fresh-status{font-size:15px;font-weight:800}
.fresh-sub{font-size:12px;color:var(--ink2);margin-top:3px}
.fresh-titles{margin-top:10px;border-top:1px dashed var(--border2);padding-top:8px}
.fresh-titles .ft{display:flex;gap:8px;font-size:12px;padding:3px 0;color:var(--ink2)}
.fresh-titles .ft b{color:var(--ink);font-weight:600}
.recheck-btn{background:var(--card);border:1px solid var(--border2);color:var(--ink);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.recheck-btn:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:60;box-shadow:0 4px 16px rgba(0,0,0,.25);animation:fadein .2s}
</style>
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div id="nav"></div>
  <div id="banner"></div>
  <div id="screen"></div>
  <div class="footer-note">Sokugan 3.2 · cross-device synced reading fluency lab</div>
</div>
<script>
// =============================================================
// SOKUGAN 3.0 — CONFIG
// =============================================================
const KEY = "sokugan_v3";
const OLD_KEY = "jp_reading_trainer_v2";
const PASS_COMP = 0.7;          // 理解度ゲート: これ未満の速度記録は無効
const NATIVE_AVG = 500;         // 日本語母語話者の平均黙読速度(字/分)
const NATIVE_GOOD = 650;        // 母語話者の上位レンジ目安
const RATCHET_UP = 1.025;       // 基準クリア時に翌日目標+2.5%
const RATCHET_RELIEF = 0.97;    // 2日連続未達で-3%の救済
const REREAD_FACTOR = 1.15;     // 反復読の目標 = 初読の15%増し
const PACER_STEP = 0.05;        // ペーサー 3-up-1-down の刻み(±5%)
const GENRES = {
  // 速報・事業トラック（具体的・速い）
  "スタートアップ":"concrete","スタートアップ・新規事業":"concrete","新規事業":"concrete",
  "AI・技術":"concrete","技術":"concrete","新技術":"concrete","テック":"concrete",
  "市場":"concrete","経済":"concrete","市場・経済":"concrete","市場・経済・地政学":"concrete","地政学":"concrete","資金調達":"concrete",
  // 論説・洞察トラック（抽象的・難しい）
  "経営":"deep","組織":"deep","経営・組織":"deep","経営・リーダーシップ":"deep","リーダーシップ":"deep","戦略":"deep",
  "社会":"deep","社会・価値観":"deep","価値観":"deep","文化":"deep",
  "未来の兆し":"deep","未来":"deep","兆し":"deep",
  "規制":"deep","環境":"deep","規制・環境":"deep","政策":"deep","科学":"deep"
};
const DEEP_GENRES = new Set(["経営","組織","経営・組織","経営・リーダーシップ","リーダーシップ","戦略","社会","社会・価値観","価値観","文化","未来の兆し","未来","兆し","規制","環境","規制・環境","政策","科学"]);

const DEFAULT_CONTENT = {
  date: "fallback",
  passages: [
    {
      id: "fb_1", tag: "経営", genre: "経営",
      title: "標準化が生む自由 — 制約設計の逆説",
      source: "fallback",
      text: "組織が成長するほど、自由と統制のバランスは難しくなる。多くの経営者は統制を「自由の対価」と捉えるが、認知科学の知見は逆を示す。人間のワーキングメモリは有限であり、些末な意思決定が増えるほど、本質的な思考に割ける資源は減る。つまり、書式や手順の標準化は自由を奪うのではなく、認知資源を解放することで創造の自由を拡大する装置になり得る。鍵は標準化の対象選定にある。反復的で判断価値の低い領域を固定し、判断価値の高い領域を意図的に未定義のまま残す。この設計を誤り、創造的領域まで手順化した組織は、規律はあるが洞察のない集団になる。逆にすべてを自由にした組織は、調整コストに溺れて何も生み出せない。優れた組織設計とは、どこを固めてどこを解き放つかの境界線を引く知的作業であり、その境界線は事業の成熟度とともに動き続ける。経営者の仕事は一度引いた線を守ることではなく、線を引き直し続けることにある。",
      questions: [
        { q: "Take-away: 経営者が認識を改めるべき本質はどれか", opts: ["標準化は認知資源を解放し創造の自由をむしろ広げうる","統制を強化するほど組織の規律と生産性は確実に高まる","自由度を最大化した組織ほど調整コストは自然に下がる","標準化の対象は一度決めたら原則として変えるべきだ"], ans: 0, rationale: "本文の中核は「標準化=自由の対価」という通念の反転。他の選択肢は本文の主張と逆方向か、末尾で明確に否定されている。" },
        { q: "隠れた前提: この主張が成り立つ暗黙の仮定はどれか", opts: ["節約された認知資源は本質的な思考の方へと向かう","標準化に伴うコストは組織の規模とは無関係である","創造的な仕事に対して手順書は常に有害に作用する","調整コストは統制を強めることによってのみ下がる"], ans: 0, rationale: "節約された認知資源が自動的に創造へ再配分されるという仮定がなければ、標準化→自由の論理は繋がらない。" },
        { q: "反証論理: この主張を最も鋭く否定するならどれか", opts: ["標準化された環境では問題発見の感度それ自体が鈍る","標準化は文書づくりの手間をいくらか増やしてしまう","自由度の高い組織にも優れた人材は十分に集まりうる","認知資源には個人差が大きく一律には一般化できない"], ans: 0, rationale: "資源解放というメリットの根本を「感度の鈍化」というコストで打ち消す反論が最も構造的。他は枝葉の指摘。" }
      ]
    },
    {
      id: "fb_2", tag: "AI・技術", genre: "AI・技術",
      title: "新技術の価値は『性能』でなく『代替する仕事の単価』で決まる",
      source: "fallback",
      text: "新しい技術の事業価値を、つい性能指標で測りたくなる。だが市場が支払うのは性能そのものではなく、その技術が肩代わりする人間の仕事の単価である。同じ精度向上でも、置き換える業務が高給の専門職なら価値は大きく、安価な単純作業なら小さい。経営判断の要点は二つに絞られる。第一に、技術が代替する仕事の現在コストはいくらか。第二に、その仕事を技術へ移すスイッチングコスト（教育・統合・信頼の再構築）はいくらか。両者の差が事業としての取り分になる。多くのスタートアップが優れた性能を持ちながら失速するのは、代替対象の単価が低い領域や、スイッチングコストが価値を上回る領域に踏み込むからだ。技術は手段にすぎず、価値は常に「誰のどの仕事を、いくらで、どれだけ滑らかに引き受けるか」で決まる。性能の競争は派手だが、勝敗を分けるのは導入の摩擦をどこまで小さくできるかという地味な設計にある。",
      questions: [
        { q: "Take-away: 経営者が認識を改めるべき本質はどれか", opts: ["技術の価値は性能でなく代替する仕事の単価で決まる","性能指標が高い技術ほど必ず大きな事業価値を生み出す","スイッチングコストは事業価値の判断とは関係していない","単純作業の自動化こそが最も収益性の高い領域だといえる"], ans: 0, rationale: "本文の核心は「市場は性能でなく肩代わりする仕事の単価に払う」。他は本文が明確に否定する通念や逆の主張。" },
        { q: "隠れた前提: この主張が成り立つ暗黙の仮定はどれか", opts: ["代替される仕事の現在コストは把握も比較も可能である","あらゆる技術は人間の仕事を完全に置き換えてしまえる","性能の差は事業としての価値には一切影響を及ぼさない","スイッチングコストは時間が解決するので無視してよい"], ans: 0, rationale: "「代替する仕事の単価」で価値を測る論理は、その単価が測定可能であることを前提にする。他は本文の主張と整合しない。" },
        { q: "シナリオ応用: この観点を自社の技術投資判断に当てはめるとどうなるか", opts: ["高単価の業務を低い摩擦で代替できる領域を優先して狙う","ベンチマーク性能が最も高い技術をまず無条件に採用する","導入の手間は度外視して精度の改善だけに資源を集中する","代替対象の単価は問わず広く薄く市場全体を取りに行く"], ans: 0, rationale: "本文の含意は高単価×低スイッチングコストの交点が取り分を最大化する。他は性能偏重や摩擦軽視で本文が戒める失速要因。" }
      ]
    }
  ]
};
// =============================================================
// STATE & MIGRATION
// =============================================================
function defaultState() {
  return {
    version: 3,
    migratedFromV2: false,
    migratedSessions: 0,
    baselineSpeed: null,
    history: [],          // {date, speed, comprehension, valid, legacy?, genreSpeeds?, targetMet?, target?}
    wins: [],             // {date, ico, text}
    streak: 0, maxStreak: 0, lastSessionDate: null,
    xp: 0,
    bestSpeed: 0,         // 理解度ゲート通過のみ
    ratchet: { target: null, missStreak: 0, clearedDates: [] },
    pacerLevel: null,     // 字/分
    pacerStreak: 0,
    spanLevel: 4,         // 瞬間キャッチの視幅(字)
    spanStreak: 0,
    todaySession: null,   // {date, count, usedPassageIds}
    seenPassageKeys: [],  // 端末で一度でも出題した本文。日付をまたいで再表示しない
    lastWinCheck: null,
    clarityFlags: [],     // ユーザーが「わかりにくい」と報告した設問 {date, genre, q}
    contentFeedback: [],  // 読後評価 {date, passageId, genre, rating, title}。次回の選定を個人化する材料
    selectedPassageId: null, // 開始前に本人が選んだ本文。選択の主体性を残す
    personalLibrary: [], // 非公開の本人用教材。YouTube台本から作る翌日解禁の学習文を保存
    goal: null,           // {target, baseline, setAt, why, hit:[]} 週次の具体的困難目標(Locke&Latham)

function sessionKeyTerms(n) {
  const seen = new Set(); const out = [];
  const known = new Set((state.vocabBook || []).filter(v => v.level >= 3).map(v => v.term));
  const pools = [sess.p1, sess.p2, ...(content.passages || [])];
  for (const p of pools) for (const t of (p.keyTerms || [])) {
    if (!t || !t.term || !t.plain || seen.has(t.term)) continue;
    seen.add(t.term); out.push(t);
  }
  out.sort((a, b) => (known.has(a.term) ? 1 : 0) - (known.has(b.term) ? 1 : 0));
  return out.slice(0, n);
}
// Deep Cloze: 接続表現を空所化し、論理関係の理解を測る（状況モデル理解の安価な測定）
const CONNECTIVES = {
  "逆接": ["しかし", "一方で", "だが", "ところが", "むしろ", "とはいえ", "それでも"],
  "因果": ["したがって", "そのため", "だから", "その結果", "ゆえに", "それゆえ"],
  "換言": ["つまり", "要するに", "すなわち", "言い換えれば"],
  "添加": ["さらに", "加えて", "そのうえ", "しかも"],
  "例示": ["たとえば", "具体的には", "事実"]
};
function makeDeepCloze(text) {
  const s = (text || "").replace(/\s/g, "");
  const sents = s.split(/(?<=[。！？])/).filter(Boolean);
  for (let i = 1; i < sents.length; i++) {
    for (const [type, list] of Object.entries(CONNECTIVES)) {
      for (const c of list) {
        if (sents[i].startsWith(c)) {
          const others = Object.entries(CONNECTIVES).filter(([t]) => t !== type).map(([t, l]) => l[Math.floor(Math.random() * l.length)]);
          shuffleArr(others);
          const opts = shuffleArr([c, ...others.slice(0, 3)]);
          const ctx = (sents[i - 1] || "").slice(-40);
          const blanked = "（　？　）" + sents[i].slice(c.length);
          return { type, correct: c, prompt: ctx + blanked, opts, ans: opts.indexOf(c) };
        }
      }
    }
  }
  return null;
}

async function loadContent() {
  try {
    const res = await fetch("./daily-content.json", { cache: "no-cache" });
    if (!res.ok) throw new Error("not ok");
    const data = await res.json();
    if (data.passages && data.passages.length > 0) {
      content = data; contentSource = "json";
      normalizeContentNumerals(content);   // 漢数字→算用数字に統一
      randomizeAllQuestionOrders(content);
      return { ok: true, date: data.date };
    }
  } catch (e) {}
  normalizeContentNumerals(content);        // フォールバック教材も正規化
  randomizeAllQuestionOrders(content);
  return { ok: false };
}
function randomizeAllQuestionOrders(c) {
  if (!c || !c.passages) return;
  for (const p of c.passages) {
    if (p.questions) p.questions = p.questions.map(q => shuffleQuestionOptions(q));
  }
}
function shuffleQuestionOptions(q) {
  if (!q || !Array.isArray(q.opts) || q.opts.length < 2) return q;
  const idx = q.opts.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return { ...q, opts: idx.map(i => q.opts[i]), ans: idx.indexOf(q.ans) };
}

// =============================================================
function currentTarget() {
  if (state.ratchet.target) return state.ratchet.target;
  const ma = movingAvg(7);
  state.ratchet.target = ma || state.baselineSpeed || 350; stampField("ratchet");
  return state.ratchet.target;
}
function applyRatchet(sessionSpeed, comp) {
  const t = currentTarget();
  const cleared = comp >= PASS_COMP && sessionSpeed >= t;
  const r = state.ratchet;
  let newTarget = t, msg = "";
  if (cleared && !r.clearedDates.includes(today())) {
    r.clearedDates.push(today());
    newTarget = Math.round(Math.min(t * RATCHET_UP, sessionSpeed * 1.08));
    newTarget = Math.max(newTarget, t + 5); // 最低+5字/分は上げる
    r.target = newTarget; r.missStreak = 0;
    msg = `基準クリア。明日の目標は <b>${newTarget}字/分</b>（+${newTarget - t}）に上がりました`;
  } else if (!cleared) {
    // その日の最後の判定はrenderResultで行うため、ここでは未達カウントだけ進めない
    msg = "";
  }
  return { cleared, oldTarget: t, newTarget, msg };
}
function relieveRatchetIfNeeded() {
  // 起動時: 直近2訓練日とも未達なら目標を3%下げる（死のスパイラル防止）
  const r = state.ratchet;
  if (!r.target) return;
  // 2.0で実際に訓練した日のみ対象（1.0レガシー記録は判定外）
  const days = [...new Set(state.history.filter(h => !h.legacy).map(h => h.date))].sort().slice(-2);
  if (days.length < 2) return;
  if (days[1] < daysAgoStr(3)) return; // 休止期間中の目標減衰を防止
  const bothMissed = days.every(d => !r.clearedDates.includes(d)) && !days.includes(today());
  if (bothMissed && r.lastRelief !== today()) {
    const old = r.target;
    r.target = Math.round(r.target * RATCHET_RELIEF);
    r.lastRelief = today();
    if (old !== r.target) {
      state.wins.push({ date: today(), ico: "🛟", text: `2日連続未達のため目標を ${old}→${r.target}字/分 に調整（再挑戦しやすく）` });
      saveState();
    }
  }
}

/*__SYNC_START__ 端末間同期（3.2）。この区間は qa/harness.js がネットワークmockでE2Eテストする。 */
// =============================================================
// CLOUD SYNC — ローカルファースト + フィールド別の決定論マージ
// =============================================================
// 設計の要点:
//  ・正本は常にローカル（localStorage）。未設定・未ログイン・オフラインでも全機能が動く。
//  ・同期は pull → merge → push の1往復。マージはサーバではなくクライアントで行う。
//  ・衝突を「後から書いた方の勝ち」で解決しない。スマホとPCの両方で増えた記録は
//    どちらも残す（集合型はunion、記録型はmax、設定型は更新時刻の新しい方）。
//  ・rev による楽観的排他。pull後に別端末が書いていたらPATCHが0行更新になり、再pullして再試行する。
const AUTH_KEY = "sokugan_auth";
const SYNC_TABLE = "sokugan_state";
const SYNC_DEBOUNCE_MS = 1500;
// status: off(未設定) / needsAuth(要ログイン) / syncing / ok / offline / error
let syncState = { status: "off", lastSyncedAt: null, error: null, pending: false, inFlight: false };
let syncTimer = null;

function syncCfg() {
  const c = (typeof window !== "undefined" && window.SOKUGAN_CONFIG) || {};
  if (!c.supabaseUrl || !c.supabaseAnonKey) return null;
  return { url: String(c.supabaseUrl).replace(/\/+$/, ""), key: String(c.supabaseAnonKey) };
}
function syncEnabled() { return !!syncCfg(); }
function loadAuth() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (e) { return null; } }
function saveAuth(a) { try { if (a) localStorage.setItem(AUTH_KEY, JSON.stringify(a)); else localStorage.removeItem(AUTH_KEY); } catch (e) {} }
function signedIn() { const a = loadAuth(); return !!(a && a.access_token && a.user_id); }
function syncEmail() { const a = loadAuth(); return a ? a.email : null; }

// ---------- マージ（純関数。ここが同期の正しさの核） ----------
function maxStr(a, b) { const x = String(a || ""), y = String(b || ""); return y > x ? (b || null) : (a || null); }
function unionBy(a, b, keyFn) {
  const out = [], seen = new Set();
  for (const x of [...(a || []), ...(b || [])]) {
    if (x == null) continue;
    const k = String(keyFn(x));
    if (seen.has(k)) continue;
    seen.add(k); out.push(x);
  }
  return out;
}
// 履歴の同一性: sessionIdがあればそれ。無い旧データは内容から合成鍵を作る
// （3.1以前の記録にはsessionIdが無いため、これが無いと同じ日の記録が二重に増える）。
function histKey(h) {
  if (h && h.sessionId) return h.sessionId;
  return [h && h.date, (h && h.mode) || "full", h && h.speed, h && h.comprehension].join("|");
}
function mergeStates(local, remote) {
  if (!remote || typeof remote !== "object") return local;
  if (!local || typeof local !== "object") return remote;
  const out = Object.assign({}, local);
  // フィールドの更新時刻。個別スタンプが無ければ状態全体の updatedAt を使う
  const ts = (s, f) => String((s.fieldTs && s.fieldTs[f]) || s.updatedAt || "");
  // 同値ならローカルを維持する（同じ入力なら常に同じ結果＝決定論）
  const newer = (f) => (ts(remote, f) > ts(local, f) ? remote : local);

  // 1) 集合型: union + 重複排除。どちらの端末で増えた分も失わない
  out.history = unionBy(local.history, remote.history, histKey)
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")) || String(histKey(a)).localeCompare(String(histKey(b))));
  out.wins = unionBy(local.wins, remote.wins, w => [w.date, w.text].join("|"));
  out.clarityFlags = unionBy(local.clarityFlags, remote.clarityFlags, f => [f.date, f.genre, f.q].join("|"));
  out.contentFeedback = unionBy(local.contentFeedback, remote.contentFeedback, contentFeedbackKey)
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || ""))).slice(-300);
  out.personalLibrary = unionBy(local.personalLibrary, remote.personalLibrary, p => p.id)
    .sort((a, b) => String(a.availableOn || "").localeCompare(String(b.availableOn || ""))).slice(-120);
  out.anchorHistory = unionBy(local.anchorHistory, remote.anchorHistory, a => [a.date, a.anchorId].join("|"))
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")));
  out.seenPassageKeys = [...new Set([...(local.seenPassageKeys || []), ...(remote.seenPassageKeys || [])])].slice(-3000);

  // 2) 語彙: term単位。習得度が高い方、同値なら記録日が新しい方
  const vb = new Map();
  for (const v of [...(local.vocabBook || []), ...(remote.vocabBook || [])]) {
    if (!v || !v.term) continue;
    const cur = vb.get(v.term);
    if (!cur) { vb.set(v.term, v); continue; }
    const lv = v.level || 0, cl = cur.level || 0;
    if (lv > cl || (lv === cl && String(v.date || "") > String(cur.date || ""))) vb.set(v.term, v);
  }
  out.vocabBook = [...vb.values()].sort((a, b) => String(a.term).localeCompare(String(b.term)));

  // 3) 記録型（自己ベスト等）: max。片方の端末で出したPBが消えない
  out.bestSpeed = Math.max(local.bestSpeed || 0, remote.bestSpeed || 0);
  out.maxStreak = Math.max(local.maxStreak || 0, remote.maxStreak || 0);
  out.xp = Math.max(local.xp || 0, remote.xp || 0);
  out.anchorIdx = Math.max(local.anchorIdx || 0, remote.anchorIdx || 0);
  out.migratedSessions = Math.max(local.migratedSessions || 0, remote.migratedSessions || 0);
  out.migratedFromV2 = !!(local.migratedFromV2 || remote.migratedFromV2);
  out.version = Math.max(local.version || 3, remote.version || 3);
  out.baselineSpeed = local.baselineSpeed != null ? local.baselineSpeed
    : (remote.baselineSpeed != null ? remote.baselineSpeed : null);

  // 4) 日付型: 後の日付。streakは時系列で決まるので lastSessionDate が新しい側の値を採る
  out.lastSessionDate = maxStr(local.lastSessionDate, remote.lastSessionDate);
  out.lastAnchorDate = maxStr(local.lastAnchorDate, remote.lastAnchorDate);
  out.lastWinCheck = maxStr(local.lastWinCheck, remote.lastWinCheck);
  out.streak = String(remote.lastSessionDate || "") > String(local.lastSessionDate || "")
    ? (remote.streak || 0) : (local.streak || 0);

  // 5) 設定型: 更新時刻の新しい側
  for (const f of ["pacerLevel", "pacerStreak", "spanLevel", "spanStreak", "goal"]) out[f] = newer(f)[f];
  const rNew = newer("ratchet").ratchet || {};
  const lRat = local.ratchet || {}, rRat = remote.ratchet || {};
  out.ratchet = {
    target: rNew.target != null ? rNew.target : null,
    missStreak: rNew.missStreak || 0,
    // 達成日は両端末のクリア実績を残す
    clearedDates: [...new Set([...(lRat.clearedDates || []), ...(rRat.clearedDates || [])])].sort()
  };
  // 目標の到達閾値も両端末で踏んだ分を残す
  if (out.goal) {
    const lHit = (local.goal && local.goal.hit) || [], rHit = (remote.goal && remote.goal.hit) || [];
    out.goal = Object.assign({}, out.goal, { hit: [...new Set([...lHit, ...rHit])].sort((a, b) => a - b) });
  }

  // 6) 当日セッション: 同日ならcountは最大・使用本文はunion。違う日なら新しい日
  const lt = local.todaySession, rt = remote.todaySession;
  if (lt && rt && lt.date === rt.date) {
    out.todaySession = { date: lt.date, count: Math.max(lt.count || 0, rt.count || 0),
      usedPassageIds: [...new Set([...(lt.usedPassageIds || []), ...(rt.usedPassageIds || [])])] };
  } else {
    out.todaySession = String((rt && rt.date) || "") > String((lt && lt.date) || "") ? rt : lt;
  }
  out.lastTakeaways = String((remote.lastTakeaways && remote.lastTakeaways.date) || "")
    > String((local.lastTakeaways && local.lastTakeaways.date) || "") ? remote.lastTakeaways : local.lastTakeaways;

  // deviceId は端末固有。マージ結果は必ず自端末のものを保つ
  out.deviceId = local.deviceId || remote.deviceId;
  // fieldTs はフィールドごとに新しい方
  const ft = {};
  for (const k of new Set([...Object.keys(local.fieldTs || {}), ...Object.keys(remote.fieldTs || {})])) {
    ft[k] = maxStr((local.fieldTs || {})[k], (remote.fieldTs || {})[k]);
  }
  out.fieldTs = ft;
  out.updatedAt = maxStr(local.updatedAt, remote.updatedAt);
  return out;
}

// ---------- 通信 ----------
async function sbFetch(path, opts) {
  const cfg = syncCfg();
  if (!cfg) throw new Error("同期が未設定です");
  const o = opts || {};
  const auth = loadAuth();
  const headers = Object.assign({ apikey: cfg.key, "Content-Type": "application/json" }, o.headers || {});
  if (auth && auth.access_token) headers.Authorization = "Bearer " + auth.access_token;
  return await fetch(cfg.url + path, Object.assign({}, o, { headers }));
}
// メールにワンタイムコードを送る（パスワード不要。スマホとPCで同じ手順）
async function syncSendCode(email) {
  const res = await sbFetch("/auth/v1/otp", { method: "POST", body: JSON.stringify({ email, create_user: true }) });
  if (!res.ok) throw new Error("コード送信に失敗しました (" + res.status + ")");
  return true;
}
async function syncVerifyCode(email, code) {
  const res = await sbFetch("/auth/v1/verify", {
    method: "POST", body: JSON.stringify({ type: "email", email, token: String(code).trim() })
  });
  if (!res.ok) throw new Error("コードが一致しません (" + res.status + ")");
  const j = await res.json();
  saveAuth({ access_token: j.access_token, refresh_token: j.refresh_token,
    user_id: j.user && j.user.id, email: (j.user && j.user.email) || email });
  return true;
}
async function refreshAuth() {
  const a = loadAuth();
  if (!a || !a.refresh_token) return false;
  const res = await sbFetch("/auth/v1/token?grant_type=refresh_token",
    { method: "POST", body: JSON.stringify({ refresh_token: a.refresh_token }) });
  if (!res.ok) return false;
  const j = await res.json();
  if (!j.access_token) return false;
  saveAuth(Object.assign({}, a, { access_token: j.access_token, refresh_token: j.refresh_token || a.refresh_token }));
  return true;
}
async function syncSignOut() {
  saveAuth(null);
  syncState = { status: syncEnabled() ? "needsAuth" : "off", lastSyncedAt: null, error: null, pending: false, inFlight: false };
  if (view === "home") renderHome(); else if (view === "history") renderHistory();
}
async function pullRemote() {
  let res = await sbFetch("/rest/v1/" + SYNC_TABLE + "?select=state,rev", { method: "GET" });
  if (res.status === 401 && await refreshAuth()) {
    res = await sbFetch("/rest/v1/" + SYNC_TABLE + "?select=state,rev", { method: "GET" });
  }
  if (res.status === 401) throw new Error("再ログインが必要です");
  if (!res.ok) throw new Error("取得に失敗 (" + res.status + ")");
  const rows = await res.json();
  return (Array.isArray(rows) && rows[0]) ? rows[0] : null;
}
// 戻り値 true=書けた / false=rev衝突（他端末が先に書いた→再pullして再試行）
async function pushRemote(stateObj, rev) {
  const auth = loadAuth();
  const body = { state: stateObj, device_id: stateObj.deviceId || null };
  if (rev == null) {
    body.user_id = auth.user_id; body.rev = 1;
    const res = await sbFetch("/rest/v1/" + SYNC_TABLE,
      { method: "POST", headers: { Prefer: "return=minimal,resolution=merge-duplicates" }, body: JSON.stringify(body) });
    if (res.status === 409) return false;
    if (!res.ok) throw new Error("保存に失敗 (" + res.status + ")");
    return true;
  }
  body.rev = rev + 1;
  const res = await sbFetch("/rest/v1/" + SYNC_TABLE + "?user_id=eq." + encodeURIComponent(auth.user_id) + "&rev=eq." + rev,
    { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error("保存に失敗 (" + res.status + ")");
  const rows = await res.json();
  return Array.isArray(rows) && rows.length > 0;   // 0件 = rev衝突
}
function isOfflineErr(e) {
  if (typeof navigator !== "undefined" && navigator && navigator.onLine === false) return true;
  return /Failed to fetch|NetworkError|network|offline|ECONN|fetch failed/i.test(String((e && e.message) || e));
}
async function syncNow(reason) {
  if (!syncEnabled()) { syncState.status = "off"; return { ok: false, reason: "off" }; }
  if (!signedIn()) { syncState.status = "needsAuth"; return { ok: false, reason: "needsAuth" }; }
  if (syncState.inFlight) { syncState.pending = true; return { ok: false, reason: "inFlight" }; }
  syncState.inFlight = true; syncState.status = "syncing"; syncState.error = null; renderSyncStatus();
  let result = { ok: false, reason: "unknown" };
  try {
    let migrated = false, conflicts = 0;
    for (let attempt = 0; attempt < 3; attempt++) {
      const row = await pullRemote();
      const remoteState = row && row.state && Object.keys(row.state).length ? row.state : null;
      if (!remoteState) migrated = true;          // クラウドが空 = 初回。ローカルを移行する（消さない）
      const merged = remoteState ? mergeStates(state, remoteState) : state;
      state = merged;
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      if (await pushRemote(state, row ? row.rev : null)) {
        syncState.status = "ok"; syncState.lastSyncedAt = new Date().toISOString();
        syncState.pending = false;
        result = { ok: true, migrated, conflicts, reason: reason || "manual" };
        break;
      }
      conflicts++;                                 // rev衝突 → 再pullして再マージ
      result = { ok: false, reason: "conflict", conflicts };
    }
    if (!result.ok && result.reason === "conflict") { syncState.status = "error"; syncState.error = "他端末と競合中。もう一度お試しください"; syncState.pending = true; }
  } catch (e) {
    if (isOfflineErr(e)) { syncState.status = "offline"; syncState.pending = true; result = { ok: false, reason: "offline" }; }
    else { syncState.status = "error"; syncState.error = String((e && e.message) || e); result = { ok: false, reason: "error", error: syncState.error }; }
  } finally {
    syncState.inFlight = false;
    renderSyncStatus();
    if (view === "home") renderHome(); else if (view === "history") renderHistory();
  }
  return result;
}
function scheduleSync(reason) {
  if (!syncEnabled() || !signedIn()) return;
  syncState.pending = true;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; syncNow(reason); }, SYNC_DEBOUNCE_MS);
}
// オフライン中に積まれた変更を、復帰・起動・フォーカス時に送る
function flushSyncQueue(reason) {
  if (!syncEnabled() || !signedIn()) return;
  if (syncState.pending || syncState.status === "offline" || syncState.status === "error") return syncNow(reason);
}
function syncStatusText() {
  if (!syncEnabled()) return { ico: "○", label: "同期未設定", cls: "muted", sub: "この端末内だけに保存されています" };
  if (!signedIn()) return { ico: "🔑", label: "要ログイン", cls: "gold", sub: "メールでログインするとスマホとPCの記録が1つになります" };
  if (syncState.status === "syncing") return { ico: "⟳", label: "同期中…", cls: "blue", sub: "" };
  if (syncState.status === "offline") return { ico: "⚠", label: "オフライン（未送信あり）", cls: "gold", sub: "オンライン復帰時に自動送信します" };
  if (syncState.status === "error") return { ico: "⚠", label: "同期エラー", cls: "coral", sub: syncState.error || "" };
  if (syncState.lastSyncedAt) {
    const d = new Date(syncState.lastSyncedAt);
    const hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
    return { ico: "✅", label: "同期済み " + hh + ":" + mm, cls: "green", sub: syncEmail() || "" };
  }
  return { ico: "•", label: "同期待ち", cls: "muted", sub: syncEmail() || "" };
}
function renderSyncStatus() {
  const el = document.getElementById("sync-line");
  if (!el) return;
  const s = syncStatusText();
  el.innerHTML = `<span>${s.ico} ${esc(s.label)}</span>` +
    (syncEnabled() && signedIn() ? ` <button class="recheck-btn" style="padding:2px 8px;font-size:11px" onclick="syncNow('manual')">今すぐ同期</button>` : "");
}
// ホーム最下部に出す1行ステータス（詳細と操作はデータ管理タブ）
function renderSyncLine() {
  const s = syncStatusText();
  return `<div class="card" style="padding:10px 14px">
    <div id="sync-line" style="display:flex;align-items:center;gap:8px;font-size:12px;justify-content:space-between">
      <span>${s.ico} ${esc(s.label)}</span>
      ${syncEnabled() && signedIn() ? `<button class="recheck-btn" style="padding:2px 8px;font-size:11px" onclick="syncNow('manual')">今すぐ同期</button>` : `<a href="javascript:go('history')" style="font-size:11px;color:var(--blue)">${syncEnabled() ? "ログインして同期" : "同期の設定"}</a>`}
    </div>
    ${s.sub ? `<div class="small" style="margin-top:3px">${esc(s.sub)}</div>` : ""}
  </div>`;
}
// データ管理タブの同期カード（ログイン導線を含む詳細UI）
function renderSyncCard() {
  const s = syncStatusText();
  if (!syncEnabled()) {
    return `<div class="card">
      <div class="card-title">端末間同期</div>
      <div class="card-subtitle">CROSS-DEVICE SYNC · 未設定</div>
      <p class="muted" style="margin-bottom:8px">現在この端末のブラウザ内（localStorage）だけに保存されています。スマホとPCで記録が分かれるのはこのためです。</p>
      <p class="small">有効にするには <code>sokugan-config.js</code> に Supabase の URL と anon key を設定してください（手順: <code>supabase/セットアップ手順.md</code>）。設定するまで、下のバックアップ書き出し／読み込みで移行できます。</p>
    </div>`;
  }
  if (!signedIn()) {
    return `<div class="card" style="border-color:var(--blue)">
      <div class="card-title">端末間同期</div>
      <div class="card-subtitle">CROSS-DEVICE SYNC · ログインすると全端末で記録が1つになります</div>
      <p class="muted" style="margin-bottom:8px">パスワードは使いません。メールに6桁のコードが届きます。スマホでも同じメールでログインすれば、履歴・語彙・目標・既読がまとまります。</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <input id="sync-email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"
          style="flex:1;min-width:180px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:14px">
        <button class="btn secondary small" onclick="uiSendCode()">コードを送る</button>
      </div>
      <div id="sync-code-row" style="display:none;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center">
        <input id="sync-code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="6桁コード"
          style="flex:1;min-width:120px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;font-size:14px">
        <button class="btn small" onclick="uiVerifyCode()">ログイン</button>
      </div>
      <div id="sync-msg" class="small" style="margin-top:8px"></div>
    </div>`;
  }
  return `<div class="card" style="border-color:var(--green)">
    <div class="card-title">端末間同期 <span class="tag" style="background:var(--green-dim);color:var(--green)">有効</span></div>
    <div class="card-subtitle">CROSS-DEVICE SYNC · ${esc(syncEmail() || "")}</div>
    <div id="sync-line" style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">
      <span>${s.ico} ${esc(s.label)}</span>
      <button class="recheck-btn" style="padding:2px 8px;font-size:11px" onclick="syncNow('manual')">今すぐ同期</button>
    </div>
    ${s.sub && s.cls !== "green" ? `<p class="small" style="margin-bottom:6px">${esc(s.sub)}</p>` : ""}
    <p class="small">スマホとPCの両方で進めた分はどちらも残ります（履歴・既読・語彙は結合、自己ベストは最大値、設定は新しい方）。オフラインでも練習でき、復帰時に自動送信します。</p>
    <button class="btn ghost small" style="margin-top:8px" onclick="syncSignOut()">この端末からログアウト</button>
  </div>`;
}
async function uiSendCode() {
  const el = document.getElementById("sync-email");
  const msg = document.getElementById("sync-msg");
  const email = (el && el.value || "").trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { if (msg) msg.innerHTML = "⚠ メールアドレスの形式を確認してください"; return; }
  if (msg) msg.innerHTML = "送信中…";
  try {
    await syncSendCode(email);
    const row = document.getElementById("sync-code-row");
    if (row) row.style.display = "flex";
    if (msg) msg.innerHTML = `✉️ ${esc(email)} にコードを送りました。届いた6桁を入力してください。`;
  } catch (e) { if (msg) msg.innerHTML = "⚠ " + esc(String(e.message || e)); }
}
async function uiVerifyCode() {
  const email = (document.getElementById("sync-email") || {}).value || "";
  const code = (document.getElementById("sync-code") || {}).value || "";
  const msg = document.getElementById("sync-msg");
  if (msg) msg.innerHTML = "確認中…";
  try {
    await syncVerifyCode(email.trim(), code);
    if (msg) msg.innerHTML = "✅ ログインしました。同期します…";
    const r = await syncNow("signin");
    showToast(r.ok ? (r.migrated ? "✅ この端末の記録をクラウドへ移行しました" : "✅ 同期しました") : "⚠ 同期は後で自動再試行します");
    render();
  } catch (e) { if (msg) msg.innerHTML = "⚠ " + esc(String(e.message || e)); }
}

// =============================================================
// INIT
// =============================================================
(async function init() {
  relieveRatchetIfNeeded();
  await loadContent();
  await loadQaReport();
  await loadClarityAudit();
  // 鮮度とQAはホームの「鮮度ゲート」パネルが常時表示する。
  // バナーは移行通知（初回のみ）に限定する。
  if (state.migratedFromV2 && !sessionStorage.getItem("migNoticeShown")) {
    sessionStorage.setItem("migNoticeShown", "1");
    showBanner(`📦 Sokugan 1.0 から <b>${state.migratedSessions}セッション</b>分の記録を引き継ぎました。目標・ペーサー速度はあなたの実績から自動設定済みです。`, "info");
  }
  render();
  // ---- 端末間同期: 起動時に1回、その後は復帰・フォーカス・保存時に走らせる ----
  if (syncEnabled()) {
    syncState.status = signedIn() ? "idle" : "needsAuth";
    if (signedIn()) syncNow("startup");
    try {
      if (typeof window !== "undefined" && window.addEventListener) {
        window.addEventListener("online", () => flushSyncQueue("online"));
        window.addEventListener("focus", () => flushSyncQueue("focus"));
        if (typeof document !== "undefined" && document.addEventListener) {
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) flushSyncQueue("visible");
          });
        }
      }
    } catch (e) {}
  }
  // PWA: Service Worker登録（GitHub Pages等のhttps配信時。鮮度はネットワーク優先で担保）
  try {
    if (typeof navigator !== "undefined" && "serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("./sw.js");
    }
  } catch (e) {}
})();
</script>
