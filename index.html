<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sokugan — Reading Fluency Lab</title>
<meta name="theme-color" content="#f2eee4">
<link rel="manifest" href="./manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sokugan">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<!-- 外部サービス設定（公開して安全な anon key のみ）。未設定でもアプリは動く。 -->
<script src="./sokugan-config.js"></script>
<style>
:root{
  /* 和紙 → 墨 → 朱。色はこの3系統だけ */
  --washi:#f2eee4; --card:#fbf9f4; --card2:#ece7da; --border:#e2dccd; --border2:#cec6b2;
  --ink:#1d1b17; --ink2:#6b6558; --ink3:#9d9689;
  --acc:#c8452b; --acc-dim:rgba(200,69,43,.10); --acc-ink:#a83a24;
  /* 旧トークン互換（全部この3系統へ畳む） */
  --coral:var(--acc); --coral-dim:var(--acc-dim);
  /* 正解・達成だけに使う控えめな緑（苔色）。朱は「今ここ」と「未達」に限る */
  --green:#4b7a51; --green-dim:rgba(75,122,81,.11);
  --gold:var(--ink2); --gold-dim:rgba(29,27,23,.05);
  --blue:var(--ink2); --blue-dim:rgba(29,27,23,.04);
  --purple:var(--ink2);
}
*{margin:0;padding:0;box-sizing:border-box}
html{color-scheme:light}
body{
  color:var(--ink);
  background-color:var(--washi);
  background-image:
    radial-gradient(rgba(124,106,74,.055) .7px, transparent .8px),
    radial-gradient(rgba(124,106,74,.038) .6px, transparent .7px),
    radial-gradient(rgba(150,132,98,.028) 1px, transparent 1.2px),
    repeating-linear-gradient(96deg, rgba(124,106,74,.020) 0 1px, transparent 1px 14px);
  background-size:7px 7px, 11px 13px, 29px 31px, auto;
  background-position:0 0, 3px 5px, 7px 11px, 0 0;
  background-attachment:fixed;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
  font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
#app{max-width:680px;margin:0 auto;padding:22px 18px 88px}
a{color:var(--ink)}
b,strong{font-weight:700}
svg.i{width:1em;height:1em;flex:none;vertical-align:-.13em;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ---- ヘッダ / ナビ ---- */
.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:11px}
.mark{flex:none;display:block}
.logo{font-size:20px;font-weight:700;letter-spacing:.2em;line-height:1}
.logo small{display:block;font-size:8.5px;color:var(--ink3);font-weight:600;letter-spacing:.32em;margin-top:5px}
/* 直近7日を点で見せる（数字を読まなくても連続が分かる） */
.streak-dots{display:flex;gap:4px;align-items:center}
.streak-dots i{width:7px;height:7px;border-radius:50%;background:var(--border2);display:block}
.streak-dots i.on{background:var(--acc)}
.streak-dots i.today{box-shadow:0 0 0 2.5px var(--acc-dim)}
.pb{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-left:14px;color:var(--ink);line-height:1.2}
.pb s{text-decoration:none;font-size:8.5px;color:var(--ink3);letter-spacing:.16em;display:block;text-align:right;font-weight:600}

.nav{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border2)}
.nav button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink3);padding:10px 0 9px;font-size:13px;letter-spacing:.06em;cursor:pointer;font-family:inherit;margin-bottom:-1px}
.nav button.active{color:var(--ink);border-bottom-color:var(--acc);font-weight:700}

/* ---- カード ---- */
.scrollwrap{position:relative}
.scrollwrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;pointer-events:none;background:linear-gradient(to bottom, rgba(251,249,244,0), var(--card))}
.card{overflow-wrap:anywhere;background:var(--card);border:1px solid var(--border);border-radius:3px;padding:18px;margin-bottom:12px}
.card-title{font-size:14.5px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:8px}
.card-subtitle{font-size:10.5px;color:var(--ink3);letter-spacing:.03em;margin-bottom:14px;line-height:1.5}
.card-subtitle.up{font-size:9px;letter-spacing:.24em;text-transform:uppercase}
.banner{padding:11px 14px;border-radius:3px;font-size:12.5px;margin-bottom:12px;border:1px solid var(--border2);background:var(--card);color:var(--ink2)}
.banner b{color:var(--ink)}
.banner.ok{border-left:2px solid var(--green)}

/* ---- ボタン ---- */
.btn{display:inline-block;background:var(--acc);color:#fff;border:1px solid var(--acc);border-radius:3px;padding:15px 20px;font-size:15px;font-weight:700;letter-spacing:.04em;cursor:pointer;font-family:inherit;width:100%;text-align:center;transition:opacity .12s}
.btn:active{opacity:.82}
.btn.secondary{background:none;color:var(--ink);border-color:var(--border2)}
.btn:disabled,.btn.secondary:disabled{background:var(--card2);border-color:var(--border);color:var(--ink3);opacity:1;cursor:default}
.btn.small{width:auto;padding:9px 14px;font-size:12.5px}
.btn.ghost{background:none;border:1px dashed var(--border2);color:var(--ink2)}
.recheck-btn{background:none;border:1px solid var(--border2);color:var(--ink2);border-radius:3px;padding:10px 13px;min-height:40px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.recheck-btn:active{opacity:.7}
.icon-btn{background:none;border:none;color:var(--ink3);cursor:pointer;font-family:inherit;font-size:17px;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;line-height:0;border-radius:3px;margin:-10px -10px -10px 0}
.icon-btn:active{color:var(--ink)}
button{touch-action:manipulation}
input,textarea,select{background:#fffdf8;border:1px solid var(--border2);color:var(--ink);border-radius:3px;padding:10px 12px;font-size:14px;font-family:inherit;appearance:none}
input::placeholder{color:var(--ink3)}
input:focus{outline:none;border-color:var(--ink3)}
code{background:var(--card2);border:1px solid var(--border);border-radius:2px;padding:1px 5px;font-size:.9em}

/* ---- 目標ゲージ（数字を読まなくても達成度が分かる） ---- */
.gauge{display:flex;align-items:center;gap:18px;margin:6px 0 4px}
.gauge svg{flex:none}
.gauge .nums{min-width:0}
.target-hero{display:flex;align-items:baseline;gap:7px}
.target-hero .num{font-size:50px;font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.target-hero .unit{font-size:9.5px;color:var(--ink3);letter-spacing:.16em;text-transform:uppercase}
.delta-chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:2px;border:1px solid var(--border2);color:var(--ink2);font-variant-numeric:tabular-nums}
.delta-chip.up{border-color:var(--green);color:var(--green)}

/* ---- 選択スロット（何本選んだかを枠で見せる） ---- */
.slots{display:flex;gap:5px;align-items:center}
.slots i{width:16px;height:16px;border:1.5px solid var(--border2);border-radius:2px;display:block}
.slots i.on{background:var(--acc);border-color:var(--acc)}

/* ---- グリッド / スタット ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:3px;overflow:hidden}
.stat-box{background:var(--card);padding:14px 6px;min-height:64px;text-align:center}
.stat-box .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.025em;line-height:1.1}
.stat-box .l{font-size:9px;color:var(--ink3);margin-top:5px;letter-spacing:.1em;text-transform:uppercase;line-height:1.4}

/* ---- リスト行 ---- */
.win-item{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--ink2)}
.win-item:last-child{border-bottom:none}
.win-item b{color:var(--ink)}
.win-item .ico{font-size:15px;line-height:1.4;color:var(--ink3);flex:none;margin-top:2px;font-variant-numeric:tabular-nums}
.win-item .d{color:var(--ink3);font-size:10.5px;font-variant-numeric:tabular-nums;margin-top:2px}

/* ---- 読書面（和紙に墨） ---- */
.reading-text{font-size:19.5px;line-height:2.15;letter-spacing:.02em;padding:8px 2px;text-align:justify;color:var(--ink)}
.reading-text.hidden-text{filter:blur(7px);user-select:none}
.chunk{border-radius:2px;padding:1px 1px;transition:background .12s}
.chunk.lit{background:var(--acc-dim);box-shadow:inset 0 -1.5px 0 var(--acc)}
.chunk.past{color:var(--ink3)}

/* ---- 進捗 ---- */
.timerbar{height:2px;background:var(--card2);overflow:hidden;margin:14px 0}
.timerbar .fill{height:100%;background:var(--ink);transition:width .25s linear}
.timerbar .fill.warning{background:var(--ink2)}
.timerbar .fill.over{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
.bigtime{font-variant-numeric:tabular-nums;font-size:36px;font-weight:700;letter-spacing:-.03em;text-align:center;margin:6px 0}

/* ---- 選択肢 ---- */
.opt{display:block;width:100%;text-align:left;background:none;border:1px solid var(--border2);color:var(--ink);border-radius:3px;padding:13px 15px;font-size:14px;line-height:1.6;cursor:pointer;margin-bottom:7px;font-family:inherit;appearance:none;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--ink3)}
.opt:focus{outline:none}
.opt:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-color:var(--blue)}
.opt.correct{border-color:var(--green);background:var(--green-dim);color:var(--ink)}
.opt.wrong{border-color:var(--acc);background:var(--acc-dim)}
.opt:disabled{cursor:default;opacity:.85}
.passage-choice{margin-bottom:0;background:none;border-color:var(--border)}
.passage-choice.chosen{border-color:var(--acc);background:var(--acc-dim)}
.rationale{border-left:2px solid var(--border2);padding:2px 0 2px 12px;font-size:12.5px;color:var(--ink2);margin:8px 0 12px}

/* ---- フェーズ ---- */
.phase-dots{display:flex;gap:5px;justify-content:center;margin-bottom:18px}
.phase-dots span{width:20px;height:2px;background:var(--border2)}
.phase-dots span.done{background:var(--ink3)}
.phase-dots span.cur{background:var(--acc)}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.1em;padding:2px 7px;border-radius:2px;border:1px solid var(--border2);background:none;color:var(--ink2);margin-right:5px}
.tag.sci{color:var(--ink3)}

/* ---- 結果 ---- */
.result-verdict{text-align:center;padding:12px 0 6px}
.result-verdict .big{font-size:62px;font-weight:700;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.result-verdict .sub{font-size:12px;color:var(--ink3);margin-top:10px}
/* 正誤を点で（3問なら3つ） */
.qdots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.qdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--border2);display:block}
.qdots i.hit{background:var(--green);border-color:var(--green)}
.qdots i.miss{background:none;border-color:var(--acc)}
.compare-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);font-size:13.5px;font-variant-numeric:tabular-nums}
.compare-row:last-child{border-bottom:none}
.compare-row .lab{color:var(--ink3);font-variant-numeric:normal}

table.hist{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.hist th{text-align:left;color:var(--ink3);font-weight:600;font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:8px 4px;border-bottom:1px solid var(--border2)}
table.hist td{padding:9px 4px;border-bottom:1px solid var(--border)}

.muted{color:var(--ink2);font-size:12.5px}
.small{font-size:11.5px;color:var(--ink3);line-height:1.6}

.celebrate{position:fixed;inset:0;background:rgba(242,238,228,.96);display:flex;align-items:center;justify-content:center;z-index:50;animation:fadein .3s}
@keyframes fadein{from{opacity:0}}
.celebrate .inner{text-align:center;padding:30px}
.celebrate .emoji{color:var(--acc);animation:pop .5s;display:inline-flex}
.celebrate .emoji svg.i{width:56px;height:56px;stroke-width:1.1}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.celebrate h2{font-size:23px;font-weight:700;margin:16px 0 6px}

.bench-wrap{margin-top:14px}
.bench-bar{position:relative;height:2px;background:var(--card2);overflow:visible}
.bench-fill{height:100%;background:var(--acc)}
.bench-mark{position:absolute;top:-4px;width:1px;height:10px;background:var(--ink3)}
.bench-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);margin-top:8px;letter-spacing:.08em;font-variant-numeric:tabular-nums;text-transform:uppercase}
.genre-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:11.5px}
.genre-bar .gname{width:76px;color:var(--ink3)}
.genre-bar .gtrack{flex:1;height:2px;background:var(--card2);overflow:hidden}
.genre-bar .gfill{height:100%}
.genre-bar .gval{width:66px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
svg text{font-family:inherit}

details.fold{border-top:1px solid var(--border);margin-top:4px}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 0 11px;font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:7px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"＋";margin-left:auto;color:var(--ink3);font-size:12px}
details.fold[open]>summary::after{content:"－"}
details.fold[open]>summary{color:var(--ink)}

.footer-note{text-align:center;font-size:8.5px;color:var(--ink3);letter-spacing:.28em;text-transform:uppercase;margin-top:36px}

.fresh{display:flex;align-items:center;gap:10px;padding:9px 2px;margin-bottom:14px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--border)}
.fresh .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--ink3)}
.fresh.ok .dot{background:var(--ink)}
.fresh.stale .dot{background:var(--acc)}
.fresh.err .dot{background:var(--acc)}
.fresh-status{font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.fresh-sub{color:var(--ink3)}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--washi);padding:11px 18px;border-radius:3px;font-size:12.5px;font-weight:600;z-index:60;box-shadow:0 6px 24px rgba(29,27,23,.22);animation:fadein .2s;display:flex;align-items:center;gap:7px;max-width:90vw}

/* iPhone 13 mini (375pt) を基準に詰める */
@media (max-width:430px){
  #app{padding:16px 14px calc(72px + env(safe-area-inset-bottom));max-width:100%}
  body{font-size:15px}
  .logo{font-size:17px;letter-spacing:.15em}
  .brand{gap:9px}
  .streak-dots i{width:6px;height:6px}
  .streak-dots{gap:3.5px}
  .pb{font-size:15px;margin-left:10px}
  .nav button{font-size:12.5px;padding:11px 0 10px}
  .card{padding:15px 14px}
  .card-title{font-size:14px}
  .gauge{gap:14px}
  .target-hero .num{font-size:44px}
  .reading-text{font-size:18px;line-height:2.05;text-align:left}
  .stat-box{padding:12px 4px;min-height:60px}
  .stat-box .v{font-size:19px}
  .stat-box .l{font-size:8.5px;letter-spacing:.06em}
  .result-verdict .big{font-size:50px}
  .opt{padding:13px 12px;font-size:13.5px}
  .btn{padding:15px 14px;font-size:15px}
  table.hist td,table.hist th{padding:8px 2px}
  .genre-bar .gname{width:66px}
  .genre-bar .gval{width:58px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom));font-size:12px}
}
@media (max-width:380px){
  #app{padding-left:12px;padding-right:12px}
  .card{padding:14px 12px}
  .target-hero .num{font-size:40px}
  .card-subtitle.up{letter-spacing:.16em}
}
</style>
</head>
<body>
<div id="app">
  <div id="header"></div>
  <div id="nav"></div>
  <div id="banner"></div>
  <div id="screen"></div>
  <div class="footer-note">SOKUGAN 3.5</div>
</div>
<script>
// =============================================================
// SOKUGAN 3.0 — CONFIG
// =============================================================
const KEY = "sokugan_v3";
const OLD_KEY = "jp_reading_trainer_v2";
const PASS_COMP = 0.6;          // 理解度ゲート: これ未満の速度記録は無効
const NATIVE_AVG = 500;         // 日本語母語話者の平均黙読速度(字/分)
const NATIVE_GOOD = 650;        // 母語話者の上位レンジ目安
const RATCHET_UP = 1.025;       // 基準クリア時に翌日目標+2.5%
const RATCHET_RELIEF = 0.97;    // 2日連続未達で-3%の救済
const REREAD_FACTOR = 1.15;     // 反復読の目標 = 初読の15%増し
const PACER_STEP = 0.05;        // ペーサー 3-up-1-down の刻み(±5%)
const GENRES = {
  // 速報・事業トラック（具体的・速い）
  "スタートアップ":"concrete","スタートアップ・新規事業":"concrete","新規事業":"concrete",
  "AI・技術":"concrete","技術":"concrete","新技術":"concrete","テック":"concrete",
  "市場":"concrete","経済":"concrete","市場・経済":"concrete","市場・経済・地政学":"concrete","地政学":"concrete","資金調達":"concrete",
  // 論説・洞察トラック（抽象的・難しい）
  "経営":"deep","組織":"deep","経営・組織":"deep","経営・リーダーシップ":"deep","リーダーシップ":"deep","戦略":"deep",
  "社会":"deep","社会・価値観":"deep","価値観":"deep","文化":"deep",
  "未来の兆し":"deep","未来":"deep","兆し":"deep",
  "規制":"deep","環境":"deep","規制・環境":"deep","政策":"deep","科学":"deep"
};
const DEEP_GENRES = new Set(["経営","組織","経営・組織","経営・リーダーシップ","リーダーシップ","戦略","社会","社会・価値観","価値観","文化","未来の兆し","未来","兆し","規制","環境","規制・環境","政策","科学"]);

const DEFAULT_CONTENT = {
  date: "fallback",
  passages: [
    {
      id: "fb_1", tag: "経営", genre: "経営",
      title: "標準化が生む自由 — 制約設計の逆説",
      source: "fallback",

function sessionKeyTerms(n) {

  const known = new Set((state.vocabBook || []).filter(v => v.level >= 3).map(v => v.term));
  const pools = [sess.p1, sess.p2, ...(content.passages || [])];
  for (const p of pools) for (const t of (p.keyTerms || [])) {
    if (!t || !t.term || !t.plain || seen.has(t.term)) continue;

// Deep Cloze: 接続表現を空所化し、論理関係の理解を測る（状況モデル理解の安価な測定）
const CONNECTIVES = {
  "逆接": ["しかし", "一方で", "だが", "ところが", "むしろ", "とはいえ", "それでも"],
  "因果": ["したがって", "そのため", "だから", "その結果", "ゆえに", "それゆえ"],
  "換言": ["つまり", "要するに", "すなわち", "言い換えれば"],
  "添加": ["さらに", "加えて", "そのうえ", "しかも"],
  "例示": ["たとえば", "具体的には", "事実"]

function makeDeepCloze(text) {
  const s = (text || "").replace(/\s/g, "");
  const sents = s.split(/(?<=[。！？])/).filter(Boolean);
  for (let i = 1; i < sents.length; i++) {
    for (const [type, list] of Object.entries(CONNECTIVES)) {
      for (const c of list) {
        if (sents[i].startsWith(c)) {
          const others = Object.entries(CONNECTIVES).filter(([t]) => t !== type).map(([t, l]) => l[Math.floor(Math.random() * l.length)]);
          shuffleArr(others);
          const opts = shuffleArr([c, ...others.slice(0, 3)]);
          const ctx = (sents[i - 1] || "").slice(-40);
          const blanked = "（　？　）" + sents[i].slice(c.length);
          return { type, correct: c, prompt: ctx + blanked, opts, ans: opts.indexOf(c) };
        }
      }
    }
  }
  return null;
}

}
function randomizeAllQuestionOrders(c) {
  if (!c || !c.passages) return;
  for (const p of c.passages) {
    if (p.questions) p.questions = p.questions.map(q => shuffleQuestionOptions(q));
  }
}
function shuffleQuestionOptions(q) {
  if (!q || !Array.isArray(q.opts) || q.opts.length < 2) return q;
  const idx = q.opts.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return { ...q, opts: idx.map(i => q.opts[i]), ans: idx.indexOf(q.ans) };
}

function currentTarget() {

  const ma = movingAvg(7);

  return state.ratchet.target;
}
function applyRatchet(sessionSpeed, comp) {

  const cleared = comp >= PASS_COMP && sessionSpeed >= t;
  const r = state.ratchet;
  let newTarget = t, msg = "";
  if (cleared && !r.clearedDates.includes(today())) {
    r.clearedDates.push(today());
    newTarget = Math.round(Math.min(t * RATCHET_UP, sessionSpeed * 1.08));
    newTarget = Math.max(newTarget, t + 5); // 最低+5字/分は上げる
    r.target = newTarget; r.missStreak = 0;
    msg = `基準クリア。明日の目標は <b>${newTarget}字/分</b>（+${newTarget - t}）に上がりました`;
  } else if (!cleared) {
    // その日の最後の判定はrenderResultで行うため、ここでは未達カウントだけ進めない
    msg = "";

  return { cleared, oldTarget: t, newTarget, msg };
}
function relieveRatchetIfNeeded() {
  // 起動時: 直近2訓練日とも未達なら目標を3%下げる（死のスパイラル防止）
  const r = state.ratchet;
  if (!r.target) return;
  // 2.0で実際に訓練した日のみ対象（1.0レガシー記録は判定外）
  const days = [...new Set(state.history.filter(h => !h.legacy).map(h => h.date))].sort().slice(-2);
  if (days.length < 2) return;
  if (days[1] < daysAgoStr(3)) return; // 休止期間中の目標減衰を防止
  const bothMissed = days.every(d => !r.clearedDates.includes(d)) && !days.includes(today());
  if (bothMissed && r.lastRelief !== today()) {
    const old = r.target;
    r.target = Math.round(r.target * RATCHET_RELIEF);
    r.lastRelief = today();
    if (old !== r.target) {
      state.wins.push({ date: today(), ico: "buoy", text: `2日連続未達のため目標を ${old}→${r.target}字/分 に調整（再挑戦しやすく）` });

    <text x="${W-10}" y="${ty - 9}" text-anchor="end" font-size="17" fill="var(--ink3)">目標 ${target}</text>

// 同じ教材の内容評価と設問評価を別端末で続けて付けても、片方を消さない。

function mergeContentFeedback(local, remote) {
  const byKey = new Map();
  for (const item of [...(local || []), ...(remote || [])]) {

    if (newer.rating == null && older.rating != null) merged.rating = older.rating;

  const youtubeVideoId = (p) => {

    if (fromUrl) return fromUrl[1];

  const res = await sbFetch("/rest/v1/" + SYNC_TABLE + "?user_id=eq." + encodeURIComponent(auth.user_id) + "&rev=eq." + rev,
    { method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error("保存に失敗 (" + res.status + ")");

  return Array.isArray(rows) && rows.length > 0;   // 0件 = rev衝突

function isOfflineErr(e) {

  return /Failed to fetch|NetworkError|network|offline|ECONN|fetch failed/i.test(String((e && e.message) || e));
}
async function syncNow(reason) {
  if (!syncEnabled()) { syncState.status = "off"; return { ok: false, reason: "off" }; }
  if (!signedIn()) { syncState.status = "needsAuth"; return { ok: false, reason: "needsAuth" }; }
  if (syncState.inFlight) { syncState.pending = true; return { ok: false, reason: "inFlight" }; }
  syncState.inFlight = true; syncState.status = "syncing"; syncState.error = null; renderSyncStatus();
  let result = { ok: false, reason: "unknown" };
  try {
    let migrated = false, conflicts = 0;
    for (let attempt = 0; attempt < 3; attempt++) {
      const row = await pullRemote();
      const remoteState = row && row.state && Object.keys(row.state).length ? row.state : null;
      if (!remoteState) migrated = true;          // クラウドが空 = 初回。ローカルを移行する（消さない）
      const merged = remoteState ? mergeStates(state, remoteState) : state;
      state = syncableState(merged);
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
      if (await pushRemote(state, row ? row.rev : null)) {
        syncState.status = "ok"; syncState.lastSyncedAt = new Date().toISOString();
        syncState.pending = false;
        result = { ok: true, migrated, conflicts, reason: reason || "manual" };
        break;
      }
      conflicts++;                                 // rev衝突 → 再pullして再マージ
      result = { ok: false, reason: "conflict", conflicts };
    }
    if (!result.ok && result.reason === "conflict") { syncState.status = "error"; syncState.error = "他端末と競合中。もう一度お試しください"; syncState.pending = true; }
  } catch (e) {
    if (isOfflineErr(e)) { syncState.status = "offline"; syncState.pending = true; result = { ok: false, reason: "offline" }; }
    else { syncState.status = "error"; syncState.error = String((e && e.message) || e); result = { ok: false, reason: "error", error: syncState.error }; }
  } finally {
    syncState.inFlight = false;
    renderSyncStatus();
    // 同期はデータだけを更新する。進行中のセッション/アンカーへは一切描画しない。
    if (!sess && !anchorState && ui.route === "home") renderHome();
    else if (!sess && !anchorState && ui.route === "history") renderHistory();
  }
  return result;
}
function scheduleSync(reason) {
  if (!syncEnabled() || !signedIn()) return;
  syncState.pending = true;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; syncNow(reason); }, SYNC_DEBOUNCE_MS);
}
// オフライン中に積まれた変更を、復帰・起動・フォーカス時に送る
function flushSyncQueue(reason) {
  if (!syncEnabled() || !signedIn()) return;
  if (syncState.pending || syncState.status === "offline" || syncState.status === "error") return syncNow(reason);
}
function syncStatusText() {
  if (!syncEnabled()) return { ico: "○", label: "同期未設定", cls: "muted", sub: "この端末内だけに保存されています" };
  if (!signedIn()) return { ico: "key", label: "要ログイン", cls: "gold", sub: "メールでログインするとスマホとPCの記録が1つになります" };
  if (syncState.status === "syncing") return { ico: "⟳", label: "同期中…", cls: "blue", sub: "" };
  if (syncState.status === "offline") return { ico: "alert", label: "オフライン（未送信あり）", cls: "gold", sub: "オンライン復帰時に自動送信します" };
  if (syncState.status === "error") return { ico: "alert", label: "同期エラー", cls: "coral", sub: syncState.error || "" };
  if (syncState.lastSyncedAt) {
    const d = new Date(syncState.lastSyncedAt);
    const hh = String(d.getHours()).padStart(2, "0"), mm = String(d.getMinutes()).padStart(2, "0");
    return { ico: "check", label: "同期済み " + hh + ":" + mm, cls: "green", sub: syncEmail() || "" };
  }
  return { ico: "•", label: "同期待ち", cls: "muted", sub: syncEmail() || "" };
}
function renderSyncStatus() {
  const el = document.getElementById("sync-line");
  if (!el) return;
  const s = syncStatusText();
  el.innerHTML = `<span>${ic(s.ico)} ${esc(s.label)}</span>` +
    (syncEnabled() && signedIn() ? ` <button class="recheck-btn" style="padding:2px 8px;font-size:11px" onclick="syncNow('manual')">今すぐ同期</button>` : "");
}
// ホーム最下部に出す1行ステータス（詳細と操作はデータ管理タブ）

    </div>

  </div>`;
}

async function uiSendCode() {
  const el = document.getElementById("sync-email");
  const msg = document.getElementById("sync-msg");
  const email = (el && el.value || "").trim();
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { if (msg) msg.innerHTML = ic("alert") + " メールアドレスの形式を確認してください"; return; }
  if (msg) msg.innerHTML = "送信中…";
  try {
    await syncSendCode(email);
    if (msg) msg.innerHTML = ic("mail") + ` ${esc(email)} にログインメールを送りました。メールの「Sign in」をタップしてください。`;
  } catch (e) { if (msg) msg.innerHTML = ic("alert") + " " + esc(String(e.message || e)); }
}
async function uiVerifyCode() {
  const email = (document.getElementById("sync-email") || {}).value || "";
  const code = (document.getElementById("sync-code") || {}).value || "";
  const msg = document.getElementById("sync-msg");
  if (msg) msg.innerHTML = "確認中…";
  try {
    await syncVerifyCode(email.trim(), code);
    if (msg) msg.innerHTML = ic("check") + " ログインしました。同期します…";
    const r = await syncNow("signin");
    showToast(r.ok ? (ic("check") + (r.migrated ? " この端末の記録をクラウドへ移行しました" : " 同期しました")) : ic("alert") + " 同期は後で自動再試行します");
    render();
  } catch (e) { if (msg) msg.innerHTML = ic("alert") + " " + esc(String(e.message || e)); }
}
// 専用パスワードの要件。RLSで自分の行しか触れず、鍵はこの端末にしか残らないため、
// 覚えられない長さを強いるより、毎日開ける長さにする方が実質的に安全（使われない同期は同期でない）。
const PASSWORD_RE = /^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}$/;
const PASSWORD_HINT = "専用パスワードは英字と数字を含む8文字以上にしてください";
// パスワードを忘れたとき: メールのリンクでそのまま入る（パスワードを再入力させない）
async function uiSendMagicLink() {
  const email = ((document.getElementById("sync-email") || {}).value || "").trim();
  const msg = document.getElementById("sync-msg");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { if (msg) msg.innerHTML = ic("alert") + " メールアドレスの形式を確認してください"; return; }
  if (msg) msg.innerHTML = "送信中…";
  try {
    await syncSendCode(email);
    if (msg) msg.innerHTML = ic("mail") + ` ${esc(email)} にログイン用リンクを送りました。メールのリンクを開くと、パスワード無しでこの端末に記録が戻ります。`;
  } catch (e) { if (msg) msg.innerHTML = ic("alert") + " " + esc(String(e.message || e)); }
}
// ログイン後に新しいパスワードを決める
async function uiSetPassword() {
  const el = document.getElementById("new-password");
  const msg = document.getElementById("sync-msg");
  const pw = (el && el.value) || "";
  if (!PASSWORD_RE.test(pw)) { if (msg) msg.innerHTML = ic("alert") + " " + PASSWORD_HINT; return; }
  if (msg) msg.innerHTML = "設定中…";
  try {
    const res = await sbFetch("/auth/v1/user", { method: "PUT", body: JSON.stringify({ password: pw }) });
    if (!res.ok) {
      let detail = ""; try { detail = (await res.json()).message || ""; } catch (e) {}
      throw new Error("設定に失敗しました" + (detail ? "（" + detail + "）" : ""));
    }
    if (el) el.value = "";
    if (msg) msg.innerHTML = ic("check") + " 次回からこのパスワードでログインできます";
  } catch (e) { if (msg) msg.innerHTML = ic("alert") + " " + esc(String(e.message || e)); }
}
async function uiPasswordAuth(mode) {
  const email = ((document.getElementById("sync-email") || {}).value || "").trim();
  const password = (document.getElementById("sync-password") || {}).value || "";
  const msg = document.getElementById("sync-msg");
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { if (msg) msg.innerHTML = ic("alert") + " メールアドレスの形式を確認してください"; return; }
  if (!PASSWORD_RE.test(password)) { if (msg) msg.innerHTML = ic("alert") + " " + PASSWORD_HINT; return; }
  if (msg) msg.innerHTML = mode === "signup" ? "登録中…" : "ログイン中…";
  try {
    const created = await syncWithPassword(email, password, mode);
    const r = await syncNow(mode === "signup" ? "signup" : "signin");
    if (msg) msg.innerHTML = ic("check") + (created ? " 登録して同期を有効にしました" : " ログインして同期を有効にしました");
    showToast(r.ok ? ic("check") + " 端末間同期を開始しました" : ic("alert") + " 同期は後で自動再試行します");
    render();
  } catch (e) { if (msg) msg.innerHTML = ic("alert") + " " + esc(String(e.message || e)); }
}

// =============================================================
(async function init() {
  const signedInFromLink = authFromMagicLink();
  relieveRatchetIfNeeded();
  await loadContent();
  await loadQaReport();
  await loadClarityAudit();
  // 鮮度とQAはホームの「鮮度ゲート」パネルが常時表示する。
  // バナーは移行通知（初回のみ）に限定する。
  if (state.migratedFromV2 && !sessionStorage.getItem("migNoticeShown")) {
    sessionStorage.setItem("migNoticeShown", "1");
    showBanner(ic("box") + ` Sokugan 1.0 から <b>${state.migratedSessions}セッション</b>分の記録を引き継ぎました。目標・ペーサー速度はあなたの実績から自動設定済みです。`, "info");
  }
  render();
  // ---- 端末間同期: 起動時に1回、その後は復帰・フォーカス・保存時に走らせる ----
  if (syncEnabled()) {
    syncState.status = signedIn() ? "idle" : "needsAuth";
    if (signedIn()) syncNow("startup");
    try {
      if (typeof window !== "undefined" && window.addEventListener) {
        window.addEventListener("online", () => flushSyncQueue("online"));
        window.addEventListener("focus", () => flushSyncQueue("focus"));
        if (typeof document !== "undefined" && document.addEventListener) {
          document.addEventListener("visibilitychange", () => {
            if (!document.hidden) flushSyncQueue("visible");
          });
        }
      }
    } catch (e) {}
  }
  if (signedInFromLink) showToast(ic("check") + " ログインしました。端末間同期を開始します");
  // PWA: Service Worker登録（GitHub Pages等のhttps配信時。鮮度はネットワーク優先で担保）
  try {
    if (typeof navigator !== "undefined" && "serviceWorker" in navigator &&
        (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("./sw.js");
    }
  } catch (e) {}
})();
